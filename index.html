<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#29172f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>English Tenses Trainer</title><style>
*{box-sizing:border-box}body{margin:0;background:#201426;color:#fff;font:16px system-ui;padding: max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}main{max-width:650px;margin:auto}h1{font-size:25px;margin:8px 0 18px}label,small{color:#d8bddb;font-size:13px}select,button{font:inherit;color:white;border:0;border-radius:10px;padding:12px;background:#49324e}select{width:100%;margin:5px 0 12px}button{cursor:pointer}button:disabled{opacity:.45}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row button{flex:1}.primary{background:#f5d479;color:#29172f;font-weight:bold}.stats{display:flex;justify-content:space-between;color:#f5d479;font-size:13px;margin:12px 0}.zone{min-height:112px;border:1px dashed #a789ae;border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px;margin:8px 0 14px}.bank{border-color:transparent;background:#ffffff08}.word{background:#b92572;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.zone:not(.bank) .word{background:#76509b}.ghost{position:fixed;pointer-events:none;z-index:100;opacity:.9}.over{outline:2px solid #f5d479}#prompt{font-size:23px;line-height:1.4}#tense{color:#f5d479}#feedback{white-space:pre-line;line-height:1.5;min-height:45px}details{margin-top:20px}progress{width:100%;accent-color:#f5d479}#status{font-size:12px;color:#c7b5ca} </style></head><body><main><small>YOUR PERSONAL ENGLISH COACH</small><h1>English Tenses Trainer</h1><label for="mode">Difficulty</label><select id="mode"><option>Practice</option><option>Hard</option><option>Expert</option></select><label for="filter">Tense selection</label><select id="filter"><option value="all">All 12 tenses</option><option value="review">Review mistakes</option></select><div class="stats"><span id="count"></span><span id="score"></span><span id="errors"></span></div><progress id="progress" max="1"></progress><h2>Build the sentence</h2><div id="tense"></div><p id="prompt"></p><small>YOUR SENTENCE</small><div class="zone" id="answer"></div><small>Tap or drag words. Not every word is needed.</small><div class="zone bank" id="bank"></div><div class="row"><button id="undo">Undo</button><button id="clear">Clear</button><button id="hint">Hint</button><button class="primary" id="check">Check</button></div><div class="row"><button id="reveal">Show answer</button><button id="speak">Listen</button><button id="skip">Skip</button></div><div id="feedback" aria-live="polite"></div><details><summary>Learning statistics</summary><div id="stats"></div><button id="resetStats">Reset statistics</button></details><p id="status"></p></main><script src="questions.js"></script><script src="app.js"></script></body></html>
